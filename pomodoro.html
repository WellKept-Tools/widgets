<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus timer · WellKept Widgets</title>
<script src="wk.js"></script>
<link rel="stylesheet" href="wk.css">
<style>
  .ring { position: relative; width: 156px; height: 156px; margin: 4px auto 12px; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 7; }
  .ring .bg { stroke: var(--line); }
  .ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .9s linear; }
  .ring.break .fg { stroke: var(--accent2); }
  .ring .in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring b { font-size: 34px; font-weight: 600; }
  .ring span { font-size: 11px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
  .dots { margin-top: 10px; font-size: 12px; color: var(--muted); }
  .dots i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--line); margin: 0 2px; vertical-align: middle; }
  .dots i.on { background: var(--accent); }
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow" id="title">Focus timer</div>
  <div class="row" id="modes" style="margin:10px 0 8px"></div>
  <div class="ring" id="ring">
    <svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="44"/><circle class="fg" id="arc" cx="50" cy="50" r="44"/></svg>
    <div class="in"><b class="big" id="left">25:00</b><span id="label">focus</span></div>
  </div>
  <div class="row">
    <button class="main" id="go">Start</button>
    <button id="reset">Reset</button>
  </div>
  <div class="dots" id="dots"></div>
  <div id="wk-brand"></div>
</div>
<script>
/* Réglages : &focus=25 &short=5 &long=15 &goal=4 (séances par jour) &title=Study%20timer &sound=0 */
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var M = [
    { k: "focus", label: "Focus", min: WK.num("focus", 25, 1, 180) },
    { k: "short", label: "Break", min: WK.num("short", 5, 1, 60) },
    { k: "long", label: "Long", min: WK.num("long", 15, 1, 90) }
  ];
  var goal = WK.num("goal", 4, 1, 12), sound = WK.param("sound") !== "0";
  $("title").textContent = WK.param("title", "Focus timer");
  var st = WK.store("pomo"), saved = st.get({}), day = WK.today();
  var done = saved.day === day ? saved.done || 0 : 0;
  var C = 2 * Math.PI * 44, arc = $("arc"); arc.style.strokeDasharray = C;
  var mode = M[0], total, left, timer = null, endAt = 0;

  $("modes").innerHTML = M.map(function (m, i) { return '<button data-i="' + i + '">' + m.label + " " + m.min + "</button>"; }).join("");
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function draw() {
    $("left").textContent = pad(Math.floor(left / 60)) + ":" + pad(left % 60);
    arc.style.strokeDashoffset = C * (1 - left / total);
    var d = ""; for (var i = 0; i < goal; i++) d += '<i class="' + (i < done ? "on" : "") + '"></i>';
    $("dots").innerHTML = d + " &nbsp;" + done + " / " + goal + " today";
  }
  function chime() {
    if (!sound) return;
    try {
      var a = new (window.AudioContext || window.webkitAudioContext)();
      [0, .35].forEach(function (t) {
        var o = a.createOscillator(), g = a.createGain();
        o.frequency.value = 660; o.connect(g); g.connect(a.destination);
        g.gain.setValueAtTime(.15, a.currentTime + t);
        g.gain.exponentialRampToValueAtTime(.001, a.currentTime + t + .3);
        o.start(a.currentTime + t); o.stop(a.currentTime + t + .3);
      });
    } catch (e) {}
  }
  function stop() { clearInterval(timer); timer = null; $("go").textContent = "Start"; }
  function set(m) {
    stop(); mode = m; total = left = m.min * 60;
    $("label").textContent = m.k === "focus" ? "focus" : "break";
    $("ring").className = "ring" + (m.k === "focus" ? "" : " break");
    [].forEach.call(document.querySelectorAll("#modes button"), function (b) { b.className = M[+b.dataset.i] === m ? "on" : ""; });
    draw();
  }
  $("go").onclick = function () {
    if (timer) { stop(); return; }
    $("go").textContent = "Pause";
    endAt = Date.now() + left * 1000;   /* horloge murale : juste même si l'onglet dort */
    timer = setInterval(function () {
      left = Math.max(0, Math.round((endAt - Date.now()) / 1000));
      if (left === 0) {
        stop(); chime();
        if (mode.k === "focus") { done++; st.set({ day: day, done: done }); set(done % goal === 0 ? M[2] : M[1]); return; }
        set(M[0]); return;
      }
      draw();
    }, 250);
  };
  $("reset").onclick = function () { set(mode); };
  [].forEach.call(document.querySelectorAll("#modes button"), function (b) { b.onclick = function () { set(M[+b.dataset.i]); }; });
  set(M[0]);
})();
</script>
</body>
</html>
