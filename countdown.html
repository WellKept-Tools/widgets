<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countdown · WellKept Widgets</title>
<script src="wk.js"></script>
<link rel="stylesheet" href="wk.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 12px 0 4px; }
  .grid div { background: var(--bg); border: 1px solid var(--line); border-radius: calc(var(--radius) * .7); padding: 8px 0 6px; }
  .grid b { display: block; font-size: 26px; font-weight: 600; }
  .grid span { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .what { font-size: 18px; margin-top: 4px; }
  .when { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .edit { margin-top: 8px; font-size: 11px; padding: 4px 10px; }
  form { display: none; margin-top: 10px; gap: 6px; flex-direction: column; align-items: stretch; }
  form.open { display: flex; }
  input { font: inherit; font-size: 13px; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); color-scheme: light dark; }
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">Countdown</div>
  <div class="what" id="what"></div>
  <div class="grid" id="grid"></div>
  <div class="when" id="when"></div>
  <button class="edit" id="edit">Set your date</button>
  <form id="form">
    <input id="in-label" maxlength="40" placeholder="What are you counting down to?">
    <input id="in-date" type="date">
    <div class="row"><button type="submit" class="main">Save</button><button type="button" id="cancel">Cancel</button></div>
  </form>
  <div id="wk-brand"></div>
</div>
<script>
/* Réglages : &label=Final%20exams (titre par défaut)  &date=2027-01-15 (date par défaut, AAAA-MM-JJ)  &id=exams
   L'acheteur choisit sa date dans le widget (« Set your date ») ; elle reste dans son navigateur. */
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var st = WK.store("countdown"), s = st.get({});
  var label = s.label || WK.param("label", "Final exams");
  var ds = s.date || WK.param("date", "");
  var target;
  function parse() {
    target = /^\d{4}-\d{2}-\d{2}$/.test(ds) ? new Date(ds + "T09:00:00") : null;
    if (!target || isNaN(target)) { target = new Date(); target.setDate(target.getDate() + 30); target.setHours(9, 0, 0, 0); ds = ""; }
    $("what").textContent = label;
    $("when").textContent = target.toLocaleDateString("en-US", { weekday: "short", month: "long", day: "numeric", year: "numeric" });
    $("edit").textContent = ds ? "Change" : "Set your date";
  }
  function draw() {
    var ms = Math.max(0, target - Date.now()), sec = Math.floor(ms / 1000);
    var p = [[Math.floor(sec / 86400), "days"], [Math.floor(sec % 86400 / 3600), "hours"], [Math.floor(sec % 3600 / 60), "min"], [sec % 60, "sec"]];
    $("grid").innerHTML = p.map(function (x) { return "<div><b>" + x[0] + "</b><span>" + x[1] + "</span></div>"; }).join("");
    if (ms === 0 && ds) $("when").textContent = "It's today. You've got this.";
  }
  $("edit").onclick = function () { $("in-label").value = label; $("in-date").value = ds; $("form").className = "open"; $("edit").style.display = "none"; };
  $("cancel").onclick = function () { $("form").className = ""; $("edit").style.display = ""; };
  $("form").onsubmit = function (e) {
    e.preventDefault();
    label = $("in-label").value.trim() || label; ds = $("in-date").value || ds;
    st.set({ label: label, date: ds }); $("cancel").onclick(); parse(); draw();
  };
  parse(); draw(); setInterval(draw, 1000);
})();
</script>
</body>
</html>
